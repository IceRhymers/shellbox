[project]
name = "shellbox-registry"
version = "0.1.0"
description = "Shellbox registry: SQLAlchemy models, Registry protocol, and alembic migrations"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "sqlalchemy>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shellbox_registry"]

[tool.ruff]
extend = "../../pyproject.toml"
