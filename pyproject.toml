[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "registry: requires a live Postgres reachable at SHELLBOX_DATABASE_URL (skipped when absent, see tests/registry/conftest.py)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["packages/*/src/*/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["packages/shellbox-mcp/src", "packages/shellbox-registry/src"]
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true

# Pin the package index in the REPO, not in developer machine config.
#
# Without this, `uv lock` resolves against whatever index the developer happens to have
# configured in ~/.config/uv/uv.toml -- and uv then bakes those artifact URLs into
# uv.lock. That happened: a lockfile referencing an internal corporate PyPI mirror was
# committed, and CI failed on every job because GitHub runners cannot reach that host.
# The URLs are also an internal hostname nobody meant to publish.
#
# Declaring it here makes the lockfile a property of the project rather than of whoever
# ran `uv lock` last.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
