[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    # `fastapi.testclient.TestClient` needs it, and `tests/unit/test_app_inventory.py` drives
    # the inventory routes through a real request because the `X-Forwarded-Email` binding is
    # half of what that file asserts.
    #
    # Declared rather than inherited. It already arrives transitively through the MCP SDK, so
    # this changes nothing about what installs today -- which is the point: the App lane's
    # tests would otherwise break the day `shellbox-mcp` changed a dependency of its own, and
    # the failure would surface as an ImportError in a package that never mentioned httpx.
    #
    # A DEV dependency, so it never reaches the deployed App. That artifact's requirement set
    # is `packages/shellbox-app/src/requirements.txt` and nothing here is copied into it.
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "registry: requires a live Postgres reachable at SHELLBOX_DATABASE_URL (skipped when absent, see tests/registry/conftest.py)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["packages/*/src/*/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = [
    "packages/shellbox-mcp/src",
    "packages/shellbox-registry/src",
    "packages/shellbox-transport/src",
    "packages/shellbox-app/src",
]
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
