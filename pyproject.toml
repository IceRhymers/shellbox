[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "registry: requires a live Postgres reachable at SHELLBOX_DATABASE_URL (skipped when absent, see tests/registry/conftest.py)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["packages/*/src/*/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["packages/shellbox-mcp/src", "packages/shellbox-registry/src"]
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
