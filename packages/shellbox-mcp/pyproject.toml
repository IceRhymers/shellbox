[project]
name = "shellbox-mcp"
version = "0.1.0"
description = "Shellbox stdio MCP server: tmux-backed shell sessions for pooled agents"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2,<2",
    "databricks-sdk>=0.40,<1",
    "shellbox-registry",
]

[project.scripts]
shellbox-mcp = "shellbox_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shellbox_mcp"]

[tool.uv.sources]
shellbox-registry = { workspace = true }

# T20 (flake8-print) is enforced here and ONLY here: this process speaks JSON-RPC over
# stdout, so a stray print() corrupts the wire protocol. spike/ and probe/ are diagnostic
# scripts that legitimately print and are excluded from this rule at the repo root.
[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
extend-select = ["T20"]
