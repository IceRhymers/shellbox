[alembic]
# Migrations travel with their models (shellbox-registry), not with the mcp package or
# the repo root; see .omc/plans/phase-2-session-plane.md §4.
script_location = packages/shellbox-registry/src/shellbox_registry/alembic

# donor idiom: os-native path separator so this works unmodified on the sandbox (Linux)
# and on a contributor's Mac.
path_separator = os

# No `sqlalchemy.url` here on purpose: env.py resolves the DSN from
# `SHELLBOX_DATABASE_URL` at runtime (unset -> no migration can run, which is correct —
# there is nothing to migrate when the registry layer is NullRegistry). Never commit a
# real DSN to this file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
