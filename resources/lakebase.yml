# The Lakebase Autoscaling Postgres that backs the registry.
#
# The verification project this replaces was created by hand and was explicitly not
# infrastructure-as-code. See section 5 of docs/lakebase-handoff.md, debt 1. This file is that
# debt paid.
#
# CRITICAL: an endpoint's parent is a BRANCH, not a project. The CLI's own description is
# "Parent is the branch containing this endpoint". So the project reference belongs on the
# BRANCH's `parent`, and the endpoint's `parent` references the branch. Getting this wrong
# produces a bundle that validates and then fails at deploy, because `bundle validate` does not
# check resource references at all -- see the note in databricks.yml.

resources:
  postgres_projects:
    pg_project:
      # `project_id` and `display_name` are different things, and the CLI says so: "Note that
      # name refers to this resource path, not the user-visible display_name". The id becomes
      # projects/<id> and is what every `databricks postgres` call addresses.
      project_id: ${var.pg_project_id}
      display_name: ${var.pg_project_display_name}
      pg_version: 17
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 4
        suspend_timeout_duration: "300s"

# NO `postgres_branches`, `postgres_endpoints` or `postgres_databases` RESOURCES, deliberately.
#
# This follows databricks-code-search/resources/lakebase.yml, which learned it first: creating
# the project AUTO-PROVISIONS the `production` branch, a READ_WRITE endpoint `primary`, an owner
# role, and a `databricks-postgres` database. Declaring them explicitly collides with the
# auto-created objects and forces `replace_existing: true` on a DATA-BEARING production branch --
# and that flag means take-over-or-recreate, so a redeploy can drop the rows. The donor's comment
# calls it "index loss on redeploy"; here it would be the hosts and sessions registry.
#
# Measured 2026-08-03 on the first real deploy, which is what sent us to look: declaring
# `postgres_databases` fails with
#
#     Field 'database.spec.role' is required, expected non-default value
#
# and fails identically WITH `replace_existing: true`, because adoption still POSTs a full spec.
# The required owner role is itself auto-provisioned per DEPLOYING USER, so it is a property of
# who deploys rather than of the target and cannot be declared portably. Not declaring the
# database avoids the question entirely.
#
# The autoscaling CU bounds and the 300s suspend are pinned on the PROJECT via
# `default_endpoint_settings` above, so ADR-18's cost decision survives without an endpoint
# resource. Downstream, `app.yml` addresses the branch and database by building paths from the
# project's `.id`, which keeps the DABs dependency edge.
#
# Note the bundle JSON schema lists PostgresDatabase.required as ['database_id', 'parent'] only,
# so the schema is LOOSER than the API: a config that validates can still fail at deploy.
