name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: make test

  # The tmux-3.4 lane is a GATE, not a confirmation.
  #
  # §7 of the plan is transcribed from spike/tmux_spike.py, and the sandbox runs
  # tmux 3.4 on Ubuntu 24.04. Every behaviour §7 depends on was measured in two
  # lanes precisely because a single-version measurement is what let three
  # rounds of command-form defects survive review. If this job fails, the tmux
  # adapter's specification is not valid -- do not merge on the strength of the
  # host lane alone.
  #
  # Pinned to the ubuntu:24.04 CONTAINER rather than relying on the runner image:
  # `ubuntu-latest` happens to ship tmux 3.4 today, but that tracks whatever
  # GitHub bumps it to, which is exactly the coupling this gate exists to remove.
  tmux-3-4:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux and Python
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            tmux python3 python3-venv curl make ca-certificates
          tmux -V

      - name: Assert the pinned tmux version
        run: |
          # A silent tmux bump under us is the thing this lane guards against, so
          # fail loudly rather than testing a version nobody chose.
          set -eu
          got="$(tmux -V)"
          case "$got" in
            "tmux 3.4") echo "tmux version as expected: $got" ;;
            *) echo "::error::expected 'tmux 3.4' (the sandbox image), got '$got'."
               echo "If the base image moved, re-run spike/tmux_spike.py against the"
               echo "new version and update spike/FINDINGS.md before changing this pin."
               exit 1 ;;
          esac

      - name: Run the spike (the §7 oracle) on tmux 3.4
        run: python3 spike/tmux_spike.py

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Run the tmux-backed suite on tmux 3.4
        run: make test-tmux

      # The integration suite drives the server over stdio against a real tmux server, so
      # it is tmux-version-sensitive too. It cannot run in the local 3.4 container (no
      # PyPI reachable there to install the mcp SDK), so CI is the only place this
      # combination is actually exercised -- which is precisely why it runs here.
      - name: Run the integration suite on tmux 3.4
        run: make test-integration

  # The spike must also pass on the developer-facing lane. Two lanes green is the
  # contract; either one alone is not.
  spike-host-lane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - run: tmux -V
      - name: Run the spike on the host lane
        run: python3 spike/tmux_spike.py

  registry:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shellbox
          POSTGRES_PASSWORD: shellbox
          POSTGRES_DB: shellbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shellbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Components, not a connection string. Writing the assembled DSN here would put a
    # complete credential-bearing URL in the repo, which credential scanners flag --
    # correctly, as a habit worth breaking. The test fixtures read these parts directly.
    env:
      SHELLBOX_PG_USER: shellbox
      SHELLBOX_PG_PASSWORD: shellbox
      SHELLBOX_PG_HOST: localhost
      SHELLBOX_PG_PORT: "5432"
      SHELLBOX_PG_DB: shellbox
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync

      # No DSN is composed here. alembic's env.py resolves it from these components via
      # shellbox_registry.dsn.dsn_from_env, so the assembled credential-bearing URL never
      # exists in the repo -- only in the process environment at runtime.
      - name: alembic upgrade -> downgrade -> upgrade
        run: make migrate-roundtrip

      # The fixtures skip when no database is reachable, which is right for a developer
      # machine and wrong here -- CI provides one, so a skip means the service container
      # or the DSN is broken and would otherwise pass silently.
      - name: Registry tests against a real Postgres
        run: make test-registry
      - name: Fail if the registry tests were skipped
        run: |
          uv run pytest tests/registry -m registry -q 2>&1 | tee /tmp/reg.txt
          if grep -qE '[0-9]+ skipped' /tmp/reg.txt; then
            echo "::error::registry tests SKIPPED in CI -- the Postgres service or the DSN is misconfigured."
            exit 1
          fi

  # The lockfile lane. `uv.lock` is NOT committed, so this job EMITS one and asserts on the
  # artifact it emitted. Read the comment above `uv.lock` in `.gitignore` and the header of
  # `scripts/check_lockfile.py` for why the file stays ignored -- both directions of committing
  # it are measured, and both break a real contributor.
  #
  # Emitting is what makes the assertions possible without committing the file: the lockfile
  # exists in the CI workspace either way. This runner configures no package index, so `uv lock`
  # here resolves against the public index by construction -- and the host allowlist below
  # measures that rather than assuming it.
  #
  # Every step is in ONE job on purpose. Emitting in one job and asserting in another would mean
  # passing the lockfile between them as an artifact, and the assertions would then be about
  # whatever was uploaded rather than about what `uv lock` produced.
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Before the emit, and it is a check rather than a precondition. If `uv.lock` ever becomes
      # committed, `uv lock` below can be a no-op and every later step then passes against the
      # committed file instead of an emitted one. Nothing else in this job would notice, and the
      # decision to keep the file ignored would be undone with everything still green.
      - name: The lockfile is not committed
        run: python3 scripts/check_lockfile.py --assert-absent uv.lock

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # The emit runs HERE, in CI, and not only on a contributor's machine.
      - name: Emit the lockfile
        run: uv lock

      # An allowlist of one host, not a blocklist of internal mirror names, plus a floor on how
      # many URLs the file must hold so a broken emit cannot pass by producing nothing. Both
      # live in `scripts/check_lockfile.py`, which is where the floor's measurement is written
      # down and where a mutation test in `tests/unit/test_check_lockfile.py` proves each
      # assertion fails on a broken artifact.
      - name: Every artifact URL is on files.pythonhosted.org, and there are enough of them
        run: python3 scripts/check_lockfile.py --assert-hosts uv.lock

      # `--locked` validates the recorded hashes against the real index at install time, so a
      # lockfile naming a missing or mismatched artifact fails loudly here.
      #
      # Deliberately NOT a from-scratch `uv lock` re-resolve compared against the recorded sha256
      # set. This workspace's upper bounds are wide -- `pytest>=8.3,<9`, `ruff>=0.6,<1`,
      # `websockets>=14,<16`, plus transitives -- so a re-resolve picks newest-satisfying, and any
      # upstream release would then redden a pull request that changed nothing. `--locked`
      # installs the pinned set rather than re-resolving, so it cannot flake that way.
      - name: Install from the emitted lockfile
        run: uv sync --locked
